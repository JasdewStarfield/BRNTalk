name: Release selected Minecraft versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: BRNTalk SemVer without a leading v
        required: true
        type: string
      target:
        description: Minecraft version to publish (both preserves the existing release scope)
        required: true
        default: both
        type: choice
        options:
          - both
          - neoforge_1_21_1
          - forge_1_20_1
      release_type:
        description: Distribution channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      draft:
        description: Keep the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      publish_modrinth:
        description: Upload selected jars to Modrinth
        required: true
        default: false
        type: boolean
      publish_curseforge:
        description: Upload selected jars to CurseForge
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: brntalk-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  select_targets:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Resolve requested Minecraft versions
        id: targets
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ inputs.target || 'both' }}
        run: |
          # Keep both versions as the default; reject unknown inputs before any build or upload.
          $targets = @(
            @{ target = 'neoforge_1_21_1'; branch = 'mc/1.21.1-neoforge'; minecraft = '1.21.1'; loader = 'NeoForge'; java = '21'; artifact = 'neoforge-1.21.1' },
            @{ target = 'forge_1_20_1'; branch = 'mc/1.20.1-forge'; minecraft = '1.20.1'; loader = 'Forge'; java = '17'; artifact = 'forge-1.20.1' }
          )
          if ($env:RELEASE_TARGET -ne 'both') {
            $targets = @($targets | Where-Object { $_.target -eq $env:RELEASE_TARGET })
          }
          if ($targets.Count -eq 0) { throw "Unknown release target: $env:RELEASE_TARGET" }
          "matrix=$(@{ include = $targets } | ConvertTo-Json -Depth 4 -Compress)" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.loader }} ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: select_targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_targets.outputs.matrix) }}

    steps:
      # Release automation is maintained on the NeoForge/default branch.
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: mc/1.21.1-neoforge
          path: automation

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          path: source

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: source/*.gradle*

      - name: Verify release metadata and build
        shell: pwsh
        run: |
          chmod +x ./source/gradlew
          ./automation/tools/release/test-release.ps1 `
            -ProjectRoot ./source `
            -Version '${{ inputs.version }}' `
            -MinecraftVersion '${{ matrix.minecraft }}' `
            -Loader '${{ matrix.loader }}' `
            -JavaVersion '${{ matrix.java }}'

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source/build/libs/brntalk-mc${{ matrix.minecraft }}-${{ inputs.version }}.jar
          if-no-files-found: error

  render_metadata:
    name: Render ${{ matrix.loader }} metadata
    needs: [select_targets, build]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.select_targets.outputs.matrix) }}
    steps:
      - name: Check out release tooling and changelogs
        uses: actions/checkout@v4
        with:
          ref: mc/1.21.1-neoforge

      - name: Render selected platform payload
        shell: pwsh
        run: |
          ./tools/release/render-platform-metadata.ps1 `
            -ProjectRoot . `
            -Version '${{ inputs.version }}' `
            -Target '${{ matrix.target }}' `
            -ReleaseType '${{ inputs.release_type }}' `
            -OutputPath './build/release-metadata/${{ matrix.target }}.json'

      - name: Upload rendered metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.artifact }}
          path: build/release-metadata/*.json
          if-no-files-found: error

  github_release:
    name: Publish GitHub Release
    needs: [select_targets, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling and changelogs
        uses: actions/checkout@v4
        with:
          ref: mc/1.21.1-neoforge
          path: source

      - name: Download selected jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build bilingual release notes
        shell: pwsh
        run: |
          ./source/tools/release/get-release-notes.ps1 `
            -ProjectRoot ./source `
            -Version '${{ inputs.version }}' `
            -OutputPath ./release-notes.md

      - name: Create or resume GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MATRIX: ${{ needs.select_targets.outputs.matrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          # The job stores release inputs outside the checkout root, so pass the repository explicitly.
          $repo = $env:GITHUB_REPOSITORY
          $jars = @(Get-ChildItem -LiteralPath ./dist -Filter '*.jar' -File)
          $targets = @((ConvertFrom-Json $env:RELEASE_MATRIX).include)
          $expectedNames = @($targets | ForEach-Object { "brntalk-mc$($_.minecraft)-$version.jar" })
          if ($jars.Count -ne $expectedNames.Count -or @($jars | Where-Object { $_.Name -notin $expectedNames }).Count -gt 0) {
            throw "Release jars do not match the selected targets: $($expectedNames -join ', ')."
          }

          gh release view $version --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingNames = @(gh release view $version --repo $repo --json assets --jq '.assets[].name')
            foreach ($jar in $jars) {
              if ($jar.Name -notin $existingNames) {
                gh release upload $version $jar.FullName --repo $repo
                if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($jar.Name)." }
              }
            }
            gh release edit $version --repo $repo --draft=${{ inputs.draft }}
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the existing GitHub Release.' }
            exit 0
          }

          $arguments = @(
            'release', 'create', $version,
            '--repo', $repo,
            '--target', 'mc/1.21.1-neoforge',
            '--title', "BRNTalk $version",
            '--notes-file', './release-notes.md'
          )
          if ('${{ inputs.draft }}' -eq 'true') { $arguments += '--draft' }
          $arguments += $jars.FullName
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the GitHub Release.' }

  modrinth:
    name: Publish Modrinth files
    if: ${{ inputs.publish_modrinth == true && inputs.draft == false }}
    needs:
      - build
      - github_release
      - render_metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling and changelogs
        uses: actions/checkout@v4
        with:
          ref: mc/1.21.1-neoforge
          path: source

      - name: Download selected jars and metadata
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to Modrinth
        shell: pwsh
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if (-not $env:MODRINTH_PROJECT_ID -or -not $env:MODRINTH_TOKEN) {
            throw 'MODRINTH_PROJECT_ID variable and MODRINTH_TOKEN secret are required.'
          }
          $common = @{
            ProjectId = $env:MODRINTH_PROJECT_ID
            Token = $env:MODRINTH_TOKEN
            Confirm = $false
          }
          # Only selected targets produced metadata artifacts; each payload names its own jar.
          $metadataFiles = @(Get-ChildItem ./dist -Filter '*.json' -File)
          if ($metadataFiles.Count -eq 0) { throw 'No selected release metadata was downloaded.' }
          foreach ($metadata in $metadataFiles) {
            $rendered = Get-Content -LiteralPath $metadata.FullName -Raw | ConvertFrom-Json
            ./source/tools/release/publish-modrinth.ps1 @common `
              -JarPath (Join-Path ./dist $rendered.jar_name) `
              -MetadataPath $metadata.FullName
          }

  curseforge:
    name: Publish CurseForge files
    if: ${{ inputs.publish_curseforge == true && inputs.draft == false }}
    needs:
      - build
      - github_release
      - render_metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling and changelogs
        uses: actions/checkout@v4
        with:
          ref: mc/1.21.1-neoforge
          path: source

      - name: Download selected jars and metadata
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if (-not $env:CURSEFORGE_PROJECT_ID -or -not $env:CURSEFORGE_TOKEN) {
            throw 'CURSEFORGE_PROJECT_ID variable and CURSEFORGE_TOKEN secret are required.'
          }
          $common = @{
            ProjectId = $env:CURSEFORGE_PROJECT_ID
            Token = $env:CURSEFORGE_TOKEN
            Confirm = $false
          }
          $metadataFiles = @(Get-ChildItem ./dist -Filter '*.json' -File)
          if ($metadataFiles.Count -eq 0) { throw 'No selected release metadata was downloaded.' }
          foreach ($metadata in $metadataFiles) {
            $rendered = Get-Content -LiteralPath $metadata.FullName -Raw | ConvertFrom-Json
            ./source/tools/release/publish-curseforge.ps1 @common `
              -JarPath (Join-Path ./dist $rendered.jar_name) `
              -MetadataPath $metadata.FullName
          }
